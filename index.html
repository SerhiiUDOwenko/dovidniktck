<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Довідник ТЦК та СП України: Контакти, Адреси, Телефони</title>
  <meta name="description" content="Повний довідник контактів ТЦК та СП України. Пошук за областю, актуальні телефони чергових частин, адреси та email. Інформація для військовозобов'язаних.">
  <meta name="keywords" content="ТЦК, військкомат контакти, адреса ТЦК, телефон чергового ТЦК, мобілізація довідник">
  
  <style>
   :root {
  /* Світла тема (за замовчуванням) */
  --primary-color: #1e3a8a;
  --accent-color: #fbbf24;
  --text-color: #1f2937;
  --bg-color: #f3f4f6;
  --card-bg: #ffffff;
  --border-color: #d1d5db;
  --hover-bg: #f9fafb;
}

/* Темна тема (активується JS) */
body.dark {
  --primary-color: #3b82f6;
  --accent-color: #d97706;
  --text-color: #e5e7eb;
  --bg-color: #111827;
  --card-bg: #1f2937;
  --border-color: #374151;
  --hover-bg: #374151;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background-color: var(--bg-color);
  color: var(--text-color);
  margin: 0;
  transition: background 0.3s, color 0.3s;
}

header {
  background-color: var(--primary-color);
  color: white;
  padding: 1rem;
  text-align: center;
}

.container {
  max-width: 1200px;
  margin: 20px auto;
  padding: 0 15px;
}

.controls {
  background: var(--card-bg);
  padding: 15px;
  border-radius: 8px;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
  border: 1px solid var(--border-color);
}

input, select {
  padding: 10px;
  border: 1px solid var(--border-color);
  background: var(--card-bg);
  color: var(--text-color);
  border-radius: 6px;
  flex-grow: 1;
}

button {
  background-color: var(--primary-color);
  color: white;
  border: none;
  padding: 10px 20px;
  border-radius: 6px;
  cursor: pointer;
}

/* Підсвітка пошуку */
mark {
  background-color: var(--accent-color);
  color: black;
  border-radius: 2px;
}

/* Таблиця */
table {
  width: 100%;
  border-collapse: collapse;
  background: var(--card-bg);
  border-radius: 8px;
  overflow: hidden;
}

th {
  background-color: var(--primary-color);
  color: white;
  padding: 12px;
  text-align: left;
}

td {
  padding: 12px;
  border-bottom: 1px solid var(--border-color);
}

tr:hover { background-color: var(--hover-bg); }

/* --- МОБІЛЬНА АДАПТАЦІЯ (КАРТКИ) --- */
@media (max-width: 768px) {
  thead { display: none; } /* Ховаємо заголовок таблиці */
  
  tr {
    display: block;
    margin-bottom: 15px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background: var(--card-bg);
  }
  
  td {
    display: flex;
    justify-content: space-between;
    text-align: right;
    border-bottom: 1px solid var(--border-color);
    padding: 10px;
  }
  
  td:last-child { border-bottom: none; }
  
  /* Використовуємо data-label, який додає ваш JS */
  td::before {
    content: attr(data-label);
    font-weight: bold;
    text-align: left;
    color: var(--primary-color);
    margin-right: 10px;
  }
}  </style>
</head>
<body>

  <header>
    <h1>🔱 Єдиний довідник контактів ТЦК та СП</h1>
    <div class="subtitle">Актуальна база адрес, телефонів та електронних пошт</div>
  </header>

  <div class="container">
    
    <div class="controls">
      <input type="text" id="search" placeholder="🔍 Введіть місто або назву району...">
      <select id="regionFilter">
        <option value="">Всі області України</option>
        </select>
      <button onclick="exportCSV()">📤 Завантажити CSV</button>
      <button class="secondary" onclick="toggleTheme()">🌙 Темна тема</button>
    </div>

    <div class="table-container">
      <table id="tzkTable">
        <thead>
          <tr>
            <th width="5%">№</th>
            <th width="35%">Назва установи</th>
            <th width="40%">Контакти (Адреса, Тел, Email)</th>
            <th width="20%">Область</th>
          </tr>
        </thead>
        <tbody>
          </tbody>
      </table>
    </div>

  </div>

  <footer>
    <p>Інформація зібрана з відкритих джерел.</p>
    <p>
      Також користуйтесь нашим сервісом: 
      <a href="https://serhiiudowenko.github.io/translit/">🇺🇦 Транслітерація для закордонного паспорта</a>
    </p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
